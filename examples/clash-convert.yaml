#
# clash-convert
# 由分享链接生成的 Clash Meta / Mihomo 配置，可直接导入 Clash Verge。
# 使用前请打开「系统代理」或 TUN，并在 🟢 Proxy 中选中实际节点。
# 规则模式下请用 https://ipinfo.io 等境外站点测试 IP；国内检测站常会走直连。
#
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
proxies:
- name: 🇺🇸 美国-233boy-hysteria2-203.0.113.10
  type: hysteria2
  server: 203.0.113.10
  port: 443
  password: 00000000-0000-0000-0000-000000000000
  alpn:
  - h3
  skip-cert-verify: true
  pin-sha256: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
proxy-groups:
- name: 🟢 Proxy
  type: select
  proxies:
  - 🇺🇸 美国-233boy-hysteria2-203.0.113.10
  - ♻️ 自动选择
  - 🇺🇸 美国
  - 🚀 直接连接
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - 🇺🇸 美国-233boy-hysteria2-203.0.113.10
- name: 🇺🇸 美国
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - 🇺🇸 美国-233boy-hysteria2-203.0.113.10
- name: 🚀 直接连接
  type: select
  proxies:
  - DIRECT
- name: ⛔️ 广告拦截
  type: select
  proxies:
  - REJECT
  - 🚀 直接连接
- name: 🌍 国外媒体
  type: select
  proxies:
  - 🟢 Proxy
  - 🇺🇸 美国
- name: 📺 谷歌服务
  type: select
  proxies:
  - 🟢 Proxy
  - 🇺🇸 美国
- name: Ⓜ️ 微软服务
  type: select
  proxies:
  - 🟢 Proxy
  - 🚀 直接连接
  - 🇺🇸 美国
- name: 🤖 AIGC
  type: select
  proxies:
  - 🟢 Proxy
  - 🇺🇸 美国
- name: 📲 电报信息
  type: select
  proxies:
  - 🟢 Proxy
  - 🇺🇸 美国
- name: 🍎 苹果服务
  type: select
  proxies:
  - 🚀 直接连接
  - 🟢 Proxy
  - 🇺🇸 美国
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🟢 Proxy
  - 🚀 直接连接
  - 🇺🇸 美国
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.localhost'
  - '*.home.arpa'
  - +.msftncsi.com
  - +.msftconnecttest.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
